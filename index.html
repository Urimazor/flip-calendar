:root{
  --bg:#000;color-scheme:dark;
  --ink:#E8E2E0;      /* off-white from the poster */
  --red:#E43321;      /* Sunday red from the poster */
  --rule:rgba(232,226,224,.42);
  --muted:#979391;
  --card:#141414;
  --card-ink:var(--ink); /* clock digits: same white as the year */
  --heb: -apple-system, "SF Hebrew", "Arial Hebrew", "Noto Sans Hebrew", "Segoe UI", Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden}
body{color:var(--ink);font-family:"CalSans",var(--heb);-webkit-font-smoothing:antialiased;cursor:none;user-select:none}
body.pointer{cursor:default}

#stage{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;flex-direction:column;padding:40px 64px 52px;transition:translate 4s ease}

/* ---------- header ---------- */
#header{display:flex;align-items:stretch;justify-content:space-between;gap:48px;flex:0 0 auto}
#info{direction:rtl;text-align:right;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;padding:6px 0 2px}
#dateBlock{margin-top:30px;display:flex;flex-direction:column;align-items:flex-start;align-self:stretch;gap:10px}
#year{font-weight:700;font-size:150px;line-height:.74;letter-spacing:-.075em;color:var(--ink);margin-left:-.06em;direction:ltr;font-feature-settings:"ss01" 0}
#greg{font-family:var(--heb);font-size:40px;white-space:nowrap;font-weight:700;letter-spacing:-.01em;line-height:1.05}
#hebrew{font-family:var(--heb);font-size:26px;white-space:nowrap;font-weight:500;color:var(--muted)}
#holiday{font-family:var(--heb);font-size:22px;white-space:nowrap;font-weight:600;color:var(--red)}
#holiday:empty{display:none}
#progress{display:flex;align-items:center;gap:.6em;align-self:stretch;white-space:nowrap;font-family:var(--heb);font-size:18px;line-height:1;color:var(--muted);direction:rtl}
#bar{flex:1 1 auto;min-width:30px;height:.74em;background:rgba(232,226,224,.30);position:relative;direction:ltr}
#bar i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
html[dir-cal="rtl"] #bar i{inset:0 0 0 auto}

/* ---------- flip clock (Fliqlo style) ---------- */
#clock{display:flex;align-items:flex-end;gap:var(--gap);--h:340px;--gap:22px;direction:ltr}
.card{--ch:var(--h);position:relative;width:calc(var(--ch)*1.06);height:var(--ch);border-radius:calc(var(--ch)*.055);perspective:calc(var(--ch)*4);color:var(--card-ink)}
.card.sec{--ch:calc(var(--h)*.42);opacity:.85}
.half,.leaf{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--card);backface-visibility:hidden}
.half.top,.leaf.top{top:0;border-radius:calc(var(--ch)*.055) calc(var(--ch)*.055) 0 0;transform-origin:50% 100%}
.half.bottom,.leaf.bottom{bottom:0;border-radius:0 0 calc(var(--ch)*.055) calc(var(--ch)*.055);transform-origin:50% 0}
.leaf{visibility:hidden;z-index:2}
.half span,.leaf span{position:absolute;left:0;right:0;height:calc(var(--ch));display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:calc(var(--ch)*.80);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.half span b,.leaf span b{display:inline-block;transform:scaleX(.80);font-weight:700}
.top span{top:0}
.bottom span{top:-100%}
.card::after{content:"";position:absolute;left:0;right:0;top:50%;height:calc(var(--ch)*.012);margin-top:calc(var(--ch)*-.006);background:#000;z-index:3}
.leaf.top{background:linear-gradient(#161616,#121212)}
.leaf.bottom{background:linear-gradient(#111,#151515)}
.ampm{position:absolute;left:calc(var(--ch)*.065);top:calc(var(--ch)*.07);font-size:calc(var(--ch)*.075);font-weight:700;z-index:4;color:var(--card-ink);letter-spacing:.02em}

/* ---------- calendar (landscape transpose of the poster) ---------- */
#calWrap{flex:1 1 auto;display:flex;flex-direction:column;margin-top:36px;min-height:0;position:relative}
#cal{flex:1 1 auto;display:grid;grid-template-columns:var(--label) repeat(37,1fr);grid-template-rows:auto repeat(12,1fr);
  font-weight:700;letter-spacing:-.045em;font-size:var(--fs);line-height:1;position:relative}
html[dir-cal="rtl"] #cal{direction:rtl}
html[dir-cal="ltr"] #cal{direction:ltr}
.wd{padding:0 0 calc(var(--fs)*.38);display:flex;align-items:flex-end;justify-content:flex-start;padding-inline-start:.06em}
.wd.sun{color:var(--red)}
.wd.now{color:var(--bg)}
.wd.now span{background:var(--ink);padding:0 .14em;border-radius:.12em}
.wd.sun.now span{background:var(--red)}
.ml{display:flex;align-items:center;justify-content:center;border-top:1.5px solid var(--rule);font-size:calc(var(--fs)*.92)}
.ml.cur{color:var(--bg)}
.ml.cur span{background:var(--ink);padding:.06em .18em;border-radius:.1em}
.row{border-top:1.5px solid var(--rule);grid-column:2 / -1}
.d{display:flex;align-items:center;justify-content:flex-start;padding-inline-start:.06em;position:relative;z-index:1;cursor:inherit;transition:opacity .6s}
html[dir-cal="rtl"] .d{direction:ltr;justify-content:flex-end;padding-inline-start:0;padding-right:.06em}
.d.sun{color:var(--red)}
.d.past{opacity:.34}
.d.today span{color:var(--bg);background:var(--ink);border-radius:.14em;padding:.04em .1em;box-shadow:0 0 0 .08em var(--bg),0 0 .5em rgba(232,226,224,.45);animation:pulse 2.4s ease-in-out infinite}
.d.today.sun span{background:var(--red)}
.d span{position:relative}
.d.hol span::after{content:"";position:absolute;left:50%;top:-.2em;width:.17em;height:.17em;margin-left:-.085em;border-radius:50%;background:var(--red)}
.d.hol.sun span::after{background:var(--ink)}
.d.today.hol span::after{top:-.32em}
body.nohol .d.hol span::after{display:none}
.d:hover span{outline:2px solid var(--ink);outline-offset:.06em;border-radius:.1em}
#colGuide{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed rgba(232,226,224,.22);pointer-events:none;z-index:0}
@keyframes pulse{0%,100%{box-shadow:0 0 0 .08em var(--bg),0 0 .25em rgba(232,226,224,.25)}50%{box-shadow:0 0 0 .08em var(--bg),0 0 .9em rgba(232,226,224,.6)}}

/* ---------- modes ---------- */
body.m-clock #calWrap,body.m-clock #info{display:none}
body.m-clock #header{flex:1;justify-content:center;align-items:center;flex-direction:column;gap:56px}
body.m-clock #clockDate{display:block}
#clockDate{display:none;margin-top:52px;font-family:var(--heb);font-size:40px;color:var(--muted);direction:rtl;text-align:center}
body.m-cal #calWrap{margin-top:36px}
body.m-cal #header{align-items:flex-start}

/* tooltip + help */
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:#000;font-family:var(--heb);font-size:15px;font-weight:600;padding:8px 12px;border-radius:6px;direction:rtl;white-space:nowrap;opacity:0;transition:opacity .15s;line-height:1.45}
#tip small{display:block;font-weight:500;opacity:.7}
#tip em{display:block;font-style:normal;color:var(--red)}
#help{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:20;font-family:var(--heb);font-size:14px;color:var(--muted);background:rgba(20,20,20,.92);border:1px solid #2a2a2a;padding:10px 18px;border-radius:999px;direction:rtl;white-space:nowrap;opacity:0;transition:opacity .4s;pointer-events:none}
#help kbd{direction:ltr;unicode-bidi:isolate;font-family:"CalSans";color:var(--ink);background:#262626;border-radius:4px;padding:1px 6px;margin:0 2px;font-size:13px}
body.pointer #help{opacity:1}
body.saver #help,body.saver:not(.wall) #tip{display:none}
.d.hov span{outline:2px solid var(--ink);outline-offset:.06em;border-radius:.1em}

/* ---------- sticky notes (live wallpaper only) ---------- */
.corner{display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(var(--fs)*.38)}
#noteAdd{position:relative;width:calc(var(--fs)*.78);height:calc(var(--fs)*.78);cursor:pointer;color:rgba(232,226,224,.55);transition:color .2s}
#noteAdd::before,#noteAdd::after{content:"";position:absolute;left:50%;top:50%;background:currentColor;border-radius:1px}
#noteAdd::before{width:100%;height:calc(var(--fs)*.085);transform:translate(-50%,-50%)}
#noteAdd::after{width:calc(var(--fs)*.085);height:100%;transform:translate(-50%,-50%)}
#noteAdd:hover,#noteAdd.hov{color:var(--ink)}
#notes{position:fixed;inset:0;pointer-events:none;z-index:30}
.note{position:absolute;width:200px;height:200px;pointer-events:auto;cursor:grab;
  background:linear-gradient(180deg,#FFF59A 0%,#FFF07A 100%);
  box-shadow:0 1px 1px rgba(0,0,0,.18),0 12px 22px -10px rgba(0,0,0,.75);border-radius:1px}
.note.drag{cursor:grabbing;box-shadow:0 2px 3px rgba(0,0,0,.2),0 22px 34px -12px rgba(0,0,0,.8)}
.note textarea{position:absolute;inset:22px 16px 16px;width:auto;height:auto;resize:none;border:0;outline:0;background:transparent;
  font-family:var(--heb);font-size:19px;line-height:1.32;color:#2A2723;pointer-events:none;cursor:inherit;overflow:hidden}
.note.editing textarea{pointer-events:auto;cursor:text}
.note .nx{position:absolute;left:6px;top:5px;width:18px;height:18px;border:0;padding:0;border-radius:50%;background:transparent;
  color:rgba(42,39,35,.55);font:400 17px/18px -apple-system,Arial,sans-serif;cursor:pointer;opacity:0;transition:opacity .15s}
.note:hover .nx,.note.hov .nx{opacity:1}
.note .nx:hover{background:rgba(42,39,35,.12);color:#2A2723}
</style>
</head>
<body class="m-both">
<div id="stage">
  <div id="header">
    <div>
      <div id="clock"></div>
      <div id="clockDate"></div>
    </div>
    <div id="info">
      <div id="year"></div>
      <div id="dateBlock">
        <div id="greg"></div>
        <div id="hebrew"></div>
        <div id="progress"><span id="progTxt"></span><div id="bar"><i></i></div></div>
        <div id="holiday"></div>
      </div>
    </div>
  </div>
  <div id="calWrap"><div id="cal"></div></div>
</div>
<div id="notes"></div>
<div id="tip"></div>
<div id="help"><kbd>1 2 3</kbd> תצוגה · <kbd>T</kbd> 12/24 · <kbd>S</kbd> שניות · <kbd>← →</kbd> שנה · <kbd>Home</kbd> היום · <kbd>D</kbd> כיוון · <kbd>H</kbd> חגים · <kbd>F</kbd> מסך מלא</div>

<script>
(() => {
"use strict";
const Q = new URLSearchParams(location.search);
const SAVER = !!(window.__SAVER__ || Q.get("saver"));
const LS = (() => { try { return window.localStorage; } catch (e) { return null; } })();
const load = (k, d) => { try { const v = LS && LS.getItem("flipcal." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const save = (k, v) => { try { LS && LS.setItem("flipcal." + k, JSON.stringify(v)); } catch (e) {} };

const S = {
  mode: Q.get("mode") || load("mode", "both"),      // both | clock | cal
  h24: Q.has("h12") ? false : load("h24", true),
  secs: Q.has("seconds") ? true : load("secs", false),
  dir: Q.get("dir") || load("dir", "rtl"),
  hol: load("hol", true),
  fixedYear: Q.get("year") ? parseInt(Q.get("year"), 10) : null,
  year: null,
  scale: parseFloat(Q.get("scale")) || (window.__SAVER__ && window.__SAVER__.scale) || 1,
};
if (SAVER) document.body.classList.add("saver");
if (window.__SAVER__ && window.__SAVER__.wallpaper) document.body.classList.add("wall");

/* ---------------- Hebrew helpers ---------------- */
const WD_HE = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const MON_HE = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const HEB_MON = {Tishri:"תשרי",Heshvan:"חשוון",Kislev:"כסלו",Tevet:"טבת",Shevat:"שבט","Adar I":"אדר א׳",Adar:"אדר","Adar II":"אדר ב׳",Nisan:"ניסן",Iyar:"אייר",Sivan:"סיוון",Tamuz:"תמוז",Av:"אב",Elul:"אלול"};
function gem(n) {
  const ones = ["","א","ב","ג","ד","ה","ו","ז","ח","ט"], tens = ["","י","כ","ל","מ","נ","ס","ע","פ","צ"], hund = ["","ק","ר","ש","ת","תק","תר","תש","תת","תתק"];
  let s = hund[Math.floor(n / 100)] || ""; const r = n % 100;
  if (r === 15) s += "טו"; else if (r === 16) s += "טז"; else s += tens[Math.floor(r / 10)] + ones[r % 10];
  return s.length === 1 ? s + "׳" : s.slice(0, -1) + "״" + s.slice(-1);
}
let hebFmt = null;
try { hebFmt = new Intl.DateTimeFormat("en-u-ca-hebrew", {day:"numeric", month:"long", year:"numeric", timeZone:"UTC"}); } catch (e) {}
function hebParts(y, m, d) {
  if (!hebFmt) return null;
  const p = {}; hebFmt.formatToParts(new Date(Date.UTC(y, m, d, 12))).forEach(x => p[x.type] = x.value);
  const day = parseInt(p.day, 10), year = parseInt(p.year || p.relatedYear, 10);
  return {day, month: p.month, year};
}
function hebString(h) { return h ? `${gem(h.day)} ב${HEB_MON[h.month] || h.month} ${gem(h.year % 1000)}` : ""; }
// Major holidays by Hebrew date (diaspora-free, Israeli calendar)
function holiday(h, y, m, d) {
  if (!h) return null;
  const k = h.month, n = h.day;
  if (k === "Tishri") { if (n === 1 || n === 2) return "ראש השנה"; if (n === 10) return "יום כיפור"; if (n === 15) return "סוכות"; if (n === 21) return "הושענא רבה"; if (n === 22) return "שמחת תורה"; }
  if (k === "Kislev" && n >= 25) return "חנוכה";
  if (k === "Tevet" && n <= 3) { // Hanukkah tail (Kislev can have 29 or 30 days)
    const back = hebParts(y, m, d - n); // last day of Kislev
    const hanDay = (back ? back.day - 24 : 6) + n;
    if (hanDay <= 8) return "חנוכה";
  }
  if (k === "Shevat" && n === 15) return "ט״ו בשבט";
  if ((k === "Adar" || k === "Adar II") && n === 14) return "פורים";
  if ((k === "Adar" || k === "Adar II") && n === 15) return "שושן פורים";
  if (k === "Nisan") { if (n === 15) return "פסח"; if (n === 21) return "שביעי של פסח"; }
  if (k === "Iyar" && n === 18) return "ל״ג בעומר";
  if (k === "Sivan" && n === 6) return "שבועות";
  const dow = new Date(y, m, d).getDay();
  if (k === "Av" && n === 9 && dow !== 6) return "תשעה באב";
  if (k === "Av" && n === 10 && dow === 0) return "תשעה באב (נדחה)";
  if (k === "Iyar" && n >= 3 && n <= 6) { // Yom HaAtzmaut with the standard shifts
    const d5 = ((dow - (n - 5)) % 7 + 7) % 7;
    const obs = d5 === 5 ? 4 : d5 === 6 ? 3 : d5 === 1 ? 6 : 5;
    if (n === obs) return "יום העצמאות";
    if (n === obs - 1) return "יום הזיכרון";

function isoWeek(dt) { const d = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate())); const day = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(d.getUTCFullYear(), 0, 1)); return Math.ceil(((d - y0) / 864e5 + 1) / 7); }

/* ---------------- flip clock ---------------- */
const clockEl = document.getElementById("clock");
function makeCard(cls) {
  const c = document.createElement("div"); c.className = "card " + (cls || "");
  c.innerHTML = '<div class="half top"><span><b></b></span></div><div class="half bottom"><span><b></b></span></div><div class="leaf top"><span><b></b></span></div><div class="leaf bottom"><span><b></b></span></div><div class="ampm"></div>';
  const q = s => c.querySelector(s + " b");
  c._ = {top: q(".half.top"), bot: q(".half.bottom"), lt: q(".leaf.top"), lb: q(".leaf.bottom"), ltEl: c.querySelector(".leaf.top"), lbEl: c.querySelector(".leaf.bottom"), ampm: c.querySelector(".ampm"), val: null, busy: null};
  return c;
}
function setCard(c, v, animate) {
  const o = c._; if (o.val === v) return;
  const old = o.val; o.val = v;
  if (o.busy) { o.busy.forEach(a => a.finish()); }
  if (!animate || old == null || !c.animate) { o.top.textContent = o.bot.textContent = v; return; }
  o.top.textContent = v; o.bot.textContent = old; o.lt.textContent = old; o.lb.textContent = v;
  o.ltEl.style.visibility = o.lbEl.style.visibility = "visible";
  const a1 = o.ltEl.animate([{transform:"rotateX(0deg)", filter:"brightness(1)"},{transform:"rotateX(-90deg)", filter:"brightness(.6)"}], {duration:300, easing:"cubic-bezier(.55,0,.9,.6)", fill:"forwards"});
  const a2 = o.lbEl.animate([{transform:"rotateX(90deg)", filter:"brightness(1.6)"},{transform:"rotateX(0deg)", filter:"brightness(1)"}], {duration:320, delay:300, easing:"cubic-bezier(.2,.7,.35,1.25)", fill:"forwards"});
  o.lbEl.style.transform = "rotateX(90deg)";
  o.busy = [a1, a2];
  a2.onfinish = () => { o.bot.textContent = v; o.ltEl.style.visibility = o.lbEl.style.visibility = "hidden"; o.lbEl.style.transform = ""; a1.cancel(); a2.cancel(); o.busy = null; };
}
let cards = [];
function buildClock() {
  clockEl.innerHTML = ""; cards = [makeCard(), makeCard()];
  if (S.secs) cards.push(makeCard("sec"));
  cards.forEach(c => clockEl.appendChild(c));
}

/* ---------------- calendar ---------------- */
const calEl = document.getElementById("cal");
let dayCells = {}, hdrCells = [], monthLabels = [];
function buildCalendar(year) {
  calEl.innerHTML = ""; dayCells = {}; hdrCells = []; monthLabels = [];
  const frag = document.createDocumentFragment();
  // header row: corner + 37 weekday letters starting on Sunday (as in the poster)
  const corner = document.createElement("div"); corner.className = "corner"; corner.style.gridRow = 1; corner.style.gridColumn = 1; frag.appendChild(corner);
  attachNoteAdd(corner);
  const L = "SMTWTFS";
  for (let i = 0; i < 37; i++) {
    const w = document.createElement("div"); w.className = "wd" + (i % 7 === 0 ? " sun" : "");
    w.style.gridRow = 1; w.style.gridColumn = i + 2; w.innerHTML = "<span>" + L[i % 7] + "</span>"; frag.appendChild(w); hdrCells.push(w);
  }
  const ML = "JFMAMJJASOND";
  for (let m = 0; m < 12; m++) {
    const r = m + 2;
    const lab = document.createElement("div"); lab.className = "ml"; lab.style.gridRow = r; lab.style.gridColumn = 1; lab.innerHTML = "<span>" + ML[m] + "</span>"; frag.appendChild(lab); monthLabels.push(lab);
    const rule = document.createElement("div"); rule.className = "row"; rule.style.gridRow = r; frag.appendChild(rule);
    const first = new Date(year, m, 1).getDay(), days = new Date(year, m + 1, 0).getDate();
    for (let d = 1; d <= days; d++) {
      const col = first + d - 1, el = document.createElement("div");
      el.className = "d" + (col % 7 === 0 ? " sun" : "");
      el.style.gridRow = r; el.style.gridColumn = col + 2;
      el.innerHTML = "<span>" + d + "</span>";
      el.dataset.m = m; el.dataset.d = d;
      const h = hebParts(year, m, d), hol = holiday(h, year, m, d);
      if (hol) { el.classList.add("hol"); el.dataset.hol = hol; }
      frag.appendChild(el); dayCells[m + "-" + d] = el;
    }

  const g = document.createElement("div"); g.id = "colGuide"; frag.appendChild(g);
  calEl.appendChild(frag);
  document.getElementById("year").textContent = year;
  markToday(true);
}
let lastKey = "";
function markToday(force) {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth(), d = now.getDate(), key = y + "-" + m + "-" + d + "-" + S.year;
  if (!force && key === lastKey) return; lastKey = key;
  calEl.querySelectorAll(".today,.now,.cur").forEach(e => e.classList.remove("today","now","cur"));
  const guide = document.getElementById("colGuide");
  const curT = new Date(y, m, d).getTime();
  for (const k in dayCells) {
    const el = dayCells[k], t = new Date(S.year, +el.dataset.m, +el.dataset.d).getTime();
    el.classList.toggle("past", t < curT);
  }
  if (S.year === y) {
    const el = dayCells[m + "-" + d]; el.classList.add("today");
    const col = new Date(y, m, 1).getDay() + d - 1;
    hdrCells[col].classList.add("now"); monthLabels[m].classList.add("cur");
    requestAnimationFrame(() => { const cr = calEl.getBoundingClientRect(), er = el.getBoundingClientRect(), sc = cr.width / calEl.offsetWidth;
      guide.style.display = ""; guide.style.left = ((S.dir === "rtl" ? er.right : er.left) - cr.left) / sc + "px"; });
  } else guide.style.display = "none";
  updateInfo();
}
function updateInfo() {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  const h = hebParts(y, m, d), hol = holiday(h, y, m, d);
  const greg = `יום ${WD_HE[now.getDay()]}, ${d} ב${MON_HE[m]} ${y}`;
  document.getElementById("greg").textContent = `יום ${WD_HE[now.getDay()]}, ${d} ב${MON_HE[m]}`;
  document.getElementById("hebrew").textContent = hebString(h);
  document.getElementById("holiday").textContent = hol || "";
  document.getElementById("clockDate").textContent = greg + (h ? " · " + hebString(h) : "");
  const start = new Date(y, 0, 1), len = (new Date(y + 1, 0, 1) - start) / 864e5, doy = Math.round((new Date(y, m, d) - start) / 864e5) + 1;
  document.getElementById("progTxt").textContent = `שבוע ${isoWeek(now)} · יום ${doy} מתוך ${len}`;
  document.querySelector("#bar i").style.width = (doy / len * 100).toFixed(2) + "%";
}

/* ---------------- tick ---------------- */
const pad = n => String(n).padStart(2, "0");
function tick(animate) {
  const now = new Date(); let h = now.getHours();
  let ap = "";
  if (!S.h24) { ap = h < 12 ? "AM" : "PM"; h = h % 12 || 12; }
  setCard(cards[0], S.h24 ? pad(h) : String(h), animate);
  setCard(cards[1], pad(now.getMinutes()), animate);
  if (cards[2]) setCard(cards[2], pad(now.getSeconds()), animate);
  cards[0]._.ampm.textContent = ap;
  const yNow = now.getFullYear();
  if (S.fixedYear == null && S.autoYear !== false && S.year !== yNow) { S.year = yNow; buildCalendar(S.year); layout(); }
  markToday(false);
}
function schedule() { const ms = 1000 - (Date.now() % 1000) + 5; setTimeout(() => { tick(true); schedule(); }, ms); }

/* ---------------- layout / scaling ---------------- */
const stage = document.getElementById("stage");
function layout() {
  const f = Math.max(0.3, Math.min(1, S.scale || 1));
  const W = innerWidth * f, H = innerHeight * f, sc = Math.min(W / 1920, H / 1080);
  stage.style.left = (innerWidth - W) / 2 + "px"; stage.style.top = (innerHeight - H) / 2 + "px";
  stage.style.width = W / sc + "px"; stage.style.height = H / sc + "px"; stage.style.transform = `scale(${sc})`;
  const sw = W / sc, sh = H / sc;
  document.body.className = document.body.className.replace(/\bm-\w+/g, "").trim() + " m-" + S.mode;
  document.documentElement.setAttribute("dir-cal", S.dir);
  document.body.classList.toggle("nohol", !S.hol);
  // clock size per mode
  let ch;
  if (S.mode === "clock") ch = Math.min(sh * 0.56, (sw - 128) / (S.secs ? 2.85 : 2.25));
  else if (S.mode === "cal") ch = 150;
  else ch = Math.min(sh - 40 - 52 - 36 - Math.max(500, sh * 0.47), (sw - 128 - 720) / 2.2);
  clockEl.style.setProperty("--h", ch + "px"); clockEl.style.setProperty("--gap", ch * 0.065 + "px");
  const yr = document.getElementById("year");
  yr.style.fontSize = (S.mode === "cal" ? 150 : Math.min(160, ch * 0.34)) + "px";
  document.getElementById("info").style.height = S.mode === "both" ? ch + "px" : "";
  // calendar font size from cell size
  requestAnimationFrame(() => {
    const cw = calEl.clientWidth, chh = calEl.clientHeight;
    const colW = cw / 38.6, rowH = chh / 13.2;
    const fs = Math.max(10, Math.min(colW * 0.66, rowH * 0.66));
    calEl.style.setProperty("--fs", fs + "px");
    calEl.style.setProperty("--label", colW * 1.6 + "px");
    fitInfo();
    markToday(true);
    reportRects();
  });
}

// keep the date block, week line and progress bar exactly as wide as the year above them
function fitInfo() {
  const info = document.getElementById("info"), yr = document.getElementById("year"), g = document.getElementById("greg");
  if (S.mode === "clock") return;
  info.style.width = "";
  const W = yr.offsetWidth; if (!W) return;
  info.style.width = W + "px";
  g.style.fontSize = "100px";
  const gfs = Math.min(46, 100 * W / g.scrollWidth);
  g.style.fontSize = gfs + "px";
  document.getElementById("hebrew").style.fontSize = gfs * 0.66 + "px";
  document.getElementById("holiday").style.fontSize = gfs * 0.56 + "px";
  const pr = document.getElementById("progress"), pt = document.getElementById("progTxt");
  let pfs = gfs * 0.46; pr.style.fontSize = pfs + "px";
  pr.style.marginTop = gfs * 0.15 + "px"; // optical: same visible gap as between the date and the Hebrew date
  const room = W - 50; if (pt.offsetWidth > room) pr.style.fontSize = pfs * room / pt.offsetWidth + "px";
  alignYearTop();
}

// push the info block down so the top of the year's digits lines up with the top of the clock's digits
function inkTop(el, text, k) { // top of the glyphs (not the line box), in stage px
  const cs = getComputedStyle(el), ctx = inkTop.ctx || (inkTop.ctx = document.createElement("canvas").getContext("2d"));
  ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  const m = ctx.measureText(text), lh = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize);
  const r = el.getBoundingClientRect(), boxH = r.height / k;
  const lineTop = r.top / k + (boxH - lh) / 2; // single line, vertically centred in its box
  return lineTop + (lh - m.fontBoundingBoxAscent - m.fontBoundingBoxDescent) / 2 + m.fontBoundingBoxAscent - m.actualBoundingBoxAscent;
}
function alignYearTop() {
  const info = document.getElementById("info"), yr = document.getElementById("year"), dig = clockEl.querySelector(".card:not(.sec) .half.top span");
  info.style.paddingTop = "";
  if (S.mode !== "both" || !dig || !yr.textContent) return;
  const k = stage.getBoundingClientRect().width / stage.offsetWidth || 1;
  const d = inkTop(dig, "0123456789", k) - inkTop(yr, yr.textContent, k);
  info.style.paddingTop = Math.max(0, parseFloat(getComputedStyle(info).paddingTop) + d) + "px";
}

/* ---------------- interaction ---------------- */
// overall size of the composition (0.3–1); the margin around it stays black
window.__setScale = v => { S.scale = +v || 1; layout(); };
function setMode(m) { S.mode = m; save("mode", m); layout(); }
function changeYear(delta) { S.autoYear = false; S.year += delta; buildCalendar(S.year); layout(); }
addEventListener("keydown", e => {
  if (e.target && e.target.closest && e.target.closest(".note")) return;
  const k = e.key.toLowerCase();
  if (k === "1") setMode("both"); else if (k === "2") setMode("clock"); else if (k === "3") setMode("cal");
  else if (k === "t") { S.h24 = !S.h24; save("h24", S.h24); cards.forEach(c => c._.val = null); tick(false); }
  else if (k === "s") { S.secs = !S.secs; save("secs", S.secs); buildClock(); tick(false); layout(); }
  else if (k === "d") { S.dir = S.dir === "rtl" ? "ltr" : "rtl"; save("dir", S.dir); layout(); }
  else if (k === "h") { S.hol = !S.hol; save("hol", S.hol); layout(); }
  else if (k === "f") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
  else if (e.key === "ArrowRight" || e.key === "PageDown") changeYear(S.dir === "rtl" ? -1 : 1);
  else if (e.key === "ArrowLeft" || e.key === "PageUp") changeYear(S.dir === "rtl" ? 1 : -1);
  else if (e.key === "Home") { S.autoYear = true; S.year = new Date().getFullYear(); buildCalendar(S.year); layout(); }
});
let hideT;
addEventListener("mousemove", () => { if (SAVER) return; document.body.classList.add("pointer"); clearTimeout(hideT); hideT = setTimeout(() => document.body.classList.remove("pointer"), 3000); });
const tip = document.getElementById("tip");
function showTip(el) {
  if (!el) { tip.style.opacity = 0; return; }
  const m = +el.dataset.m, d = +el.dataset.d, dt = new Date(S.year, m, d), h = hebParts(S.year, m, d);
  tip.innerHTML = `יום ${WD_HE[dt.getDay()]}, ${d} ב${MON_HE[m]} ${S.year}<small>${hebString(h)}</small>` + (el.dataset.hol ? `<em>${el.dataset.hol}</em>` : "");
  const r = el.getBoundingClientRect(); tip.style.opacity = 1;
  const tw = tip.offsetWidth; tip.style.left = Math.max(8, Math.min(innerWidth - tw - 8, r.left + r.width / 2 - tw / 2)) + "px"; tip.style.top = Math.max(8, r.top - tip.offsetHeight - 10) + "px";
}
calEl.addEventListener("mouseover", e => { showTip(SAVER ? null : e.target.closest(".d")); });
// wallpaper: the app passes the mouse position (page px) while the pointer is over the uncovered desktop
let hoverEl = null;
window.__hover = (x, y) => {
  const hit = x == null ? null : document.elementFromPoint(x, y);
  document.querySelectorAll(".note.hov,#noteAdd.hov").forEach(e => e.classList.remove("hov"));
  const nh = hit && hit.closest(".note,#noteAdd"); if (nh) nh.classList.add("hov");
  const el = hit && !nh ? hit.closest(".d") : null;
  if (el === hoverEl) return; hoverEl = el;
  document.querySelectorAll(".d.hov").forEach(e => e.classList.remove("hov"));
  if (el) el.classList.add("hov");
  showTip(el);
};
calEl.addEventListener("mouseleave", () => tip.style.opacity = 0);

/* ---------------- sticky notes (live wallpaper only) ---------------- */
// The wallpaper window normally lets every click through to the desktop. The page tells the app where the
// clickable things are (the + and the notes); the app turns on clicks only while the pointer is over one of them.
const NOTES_ON = !!(window.__SAVER__ && window.__SAVER__.wallpaper) || Q.has("notes");
const native = m => { try { window.webkit.messageHandlers.flip.postMessage(m); } catch (e) {} };
const notesEl = document.getElementById("notes");
let notes = [];
if (NOTES_ON) {
  try { notes = (window.__SAVER__ && Array.isArray(window.__SAVER__.notes)) ? window.__SAVER__.notes : load("notes", []); } catch (e) { notes = []; }
  if (!Array.isArray(notes)) notes = [];
}
const addBtn = document.createElement("div"); addBtn.id = "noteAdd";
function attachNoteAdd(corner) { if (NOTES_ON) corner.appendChild(addBtn); }
let persistT;
function persist() {
  clearTimeout(persistT);
  persistT = setTimeout(() => { const j = JSON.stringify(notes); native({type: "notes", json: j}); if (!window.__SAVER__) save("notes", notes); }, 250);
}
function reportRects() {
  if (!NOTES_ON) return;
  const els = [addBtn, ...notesEl.children].filter(e => e.isConnected && e.offsetWidth);
  native({type: "rects", rects: els.map(e => { const r = e.getBoundingClientRect(); return [r.left, r.top, r.width, r.height]; })});
}
const clampX = x => Math.max(0, Math.min(innerWidth - 200, x)), clampY = y => Math.max(0, Math.min(innerHeight - 200, y));
function renderNote(n) {
  const el = document.createElement("div"); el.className = "note";
  el.style.left = (n.x = clampX(n.x)) + "px"; el.style.top = (n.y = clampY(n.y)) + "px";
  const ta = document.createElement("textarea"); ta.dir = "auto"; ta.spellcheck = false; ta.value = n.text || "";
  const x = document.createElement("button"); x.className = "nx"; x.textContent = "×"; x.tabIndex = -1;
  el.append(ta, x); notesEl.appendChild(el);
  x.addEventListener("mousedown", e => e.stopPropagation());
  x.addEventListener("click", e => {
    e.stopPropagation(); notes = notes.filter(o => o !== n); el.remove(); persist(); reportRects();
  });
  ta.addEventListener("input", () => { n.text = ta.value; persist(); });
  ta.addEventListener("blur", () => { el.classList.remove("editing"); n.text = ta.value; persist(); });
  ta.addEventListener("keydown", e => { if (e.key === "Escape") ta.blur(); });
  // drag anywhere on the note (while typing: drag from its margin); a click without moving starts typing
  el.addEventListener("mousedown", e => {
    if (e.button !== 0 || (el.classList.contains("editing") && e.target === ta)) return;
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY, ox = n.x, oy = n.y; let moved = false;
    notesEl.appendChild(el); // bring to front
    const mv = ev => {
      if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 4) return;
      moved = true; el.classList.add("drag");
      n.x = clampX(ox + ev.clientX - sx); n.y = clampY(oy + ev.clientY - sy);
      el.style.left = n.x + "px"; el.style.top = n.y + "px"; reportRects();
    };
    const up = () => {
      removeEventListener("mousemove", mv); removeEventListener("mouseup", up); el.classList.remove("drag");
      if (moved) { notes = notes.filter(o => o !== n).concat(n); persist(); reportRects(); } else editNote(el);
    };
    addEventListener("mousemove", mv); addEventListener("mouseup", up);
  });
  return el;
}
function editNote(el) {
  const ta = el.querySelector("textarea"); el.classList.add("editing");
  native({type: "focus"});
  setTimeout(() => { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 30);
}
addBtn.addEventListener("mousedown", e => e.preventDefault());
addBtn.addEventListener("click", () => {
  const r = addBtn.getBoundingClientRect(), k = notes.length % 6;
  const n = {x: r.left - 230 - k * 26, y: r.bottom + 14 + k * 26, text: ""};
  notes.push(n); const el = renderNote(n); persist(); reportRects(); editNote(el);
});
if (NOTES_ON) { notes.forEach(renderNote); setInterval(reportRects, 2000); addEventListener("resize", () => setTimeout(reportRects, 50)); }

// gentle drift against burn-in (moves a few px every minute)
let driftN = 0;
setInterval(() => { driftN++; const a = driftN * 2.399; stage.style.translate = `${Math.round(Math.cos(a) * 6)}px ${Math.round(Math.sin(a) * 6)}px`; setTimeout(reportRects, 4200); }, 60000);

/* ---------------- go ---------------- */
S.year = S.fixedYear || new Date().getFullYear();
buildClock(); buildCalendar(S.year); layout(); tick(false); schedule();
addEventListener("resize", layout);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
})();
</script>
</body>
